<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatFlow Test Client</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.4;
  }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; border-bottom: 1px solid #8884; padding-bottom: .3rem; }
  section { margin-bottom: 1rem; }
  label { display: block; font-size: .8rem; opacity: .75; margin-top: .5rem; }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: .5rem;
    margin-top: .2rem;
    border-radius: 6px;
    border: 1px solid #8886;
    background: transparent;
    color: inherit;
  }
  button {
    margin-top: .6rem;
    padding: .5rem .9rem;
    border-radius: 6px;
    border: 1px solid #8886;
    background: #7c7cf022;
    color: inherit;
    cursor: pointer;
  }
  button:hover { background: #7c7cf044; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1; min-width: 140px; }
  .status { font-size: .85rem; padding: .5rem; border-radius: 6px; margin-top: .5rem; white-space: pre-wrap; word-break: break-all; }
  .status.ok { background: #2ecc7122; }
  .status.err { background: #e74c3c22; }
  .status.info { background: #7c7cf022; }
  ul#roomList { list-style: none; padding: 0; }
  ul#roomList li {
    display: flex; align-items: center; gap: .5rem;
    padding: .4rem .2rem; border-bottom: 1px solid #8883;
  }
  ul#roomList li .name { flex: 1; }
  #log {
    height: 220px;
    overflow-y: auto;
    border: 1px solid #8886;
    border-radius: 6px;
    padding: .5rem;
    font-size: .85rem;
    font-family: ui-monospace, monospace;
    background: #8881 0d;
  }
  #log .msg { margin: .1rem 0; }
  #log .sys { opacity: .6; font-style: italic; }
  #whoami { font-size: .85rem; opacity: .8; }
  code { font-size: .85em; }
</style>
</head>
<body>
<h1>ChatFlow 테스트 클라이언트</h1>
<p id="whoami">로그인되어 있지 않습니다.</p>

<section>
  <h2>0. 서버 설정</h2>
  <label>API Base URL (nginx가 떠 있는 주소, 예: http://localhost 또는 https://your-domain)</label>
  <input id="apiBase" placeholder="http://localhost" />
  <button id="saveBase">저장</button>
  <div id="baseStatus" class="status info" style="display:none"></div>
</section>

<section>
  <h2>1. 회원가입</h2>
  <div class="row">
    <input id="signupName" placeholder="이름" />
    <input id="signupUsername" placeholder="아이디(username)" />
  </div>
  <div class="row">
    <input id="signupEmail" placeholder="이메일" type="email" />
    <input id="signupPassword" placeholder="비밀번호" type="password" />
  </div>
  <button id="signupBtn">회원가입</button>
  <div id="signupStatus" class="status" style="display:none"></div>
</section>

<section>
  <h2>2. 로그인 (Spring → JWT 발급)</h2>
  <div class="row">
    <input id="loginUsername" placeholder="아이디(username)" />
    <input id="loginPassword" placeholder="비밀번호" type="password" />
  </div>
  <div class="row">
    <button id="loginBtn">로그인</button>
    <button id="logoutBtn" disabled>로그아웃</button>
  </div>
  <div id="loginStatus" class="status" style="display:none"></div>
</section>

<section>
  <h2>3. 방 목록 / 생성 (Go, JWT로 인증)</h2>
  <button id="refreshRoomsBtn">방 목록 새로고침</button>
  <ul id="roomList"></ul>

  <div class="row">
    <input id="roomName" placeholder="새 방 이름" />
    <input id="roomDesc" placeholder="설명(선택)" />
  </div>
  <button id="createRoomBtn">방 만들기</button>
  <div id="roomStatus" class="status" style="display:none"></div>
</section>

<section>
  <h2>4. /ws 참가 &amp; 채팅</h2>
  <p class="status info" id="currentRoom" style="display:none"></p>
  <div id="log"></div>
  <div class="row">
    <input id="chatInput" placeholder="메시지 입력 후 Enter" disabled />
    <button id="sendBtn" disabled>전송</button>
  </div>
  <button id="disconnectBtn" disabled>연결 종료</button>
</section>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const state = {
    apiBase: localStorage.getItem("cf_api_base") || "",
    accessToken: localStorage.getItem("cf_access_token") || "",
    username: localStorage.getItem("cf_username") || "",
    ws: null,
    currentRoomId: null,
  };

  function showStatus(el, message, kind) {
    el.textContent = message;
    el.className = "status " + (kind || "info");
    el.style.display = "block";
  }

  function refreshWhoAmI() {
    $("whoami").textContent = state.username
      ? `${state.username}(으)로 로그인됨`
      : "로그인되어 있지 않습니다.";
    $("logoutBtn").disabled = !state.accessToken;
  }

  function apiUrl(path) {
    return state.apiBase.replace(/\/+$/, "") + path;
  }

  async function api(path, options) {
    options = options || {};
    const headers = Object.assign({}, options.headers);
    if (options.body) headers["Content-Type"] = "application/json";
    if (state.accessToken) headers["Authorization"] = "Bearer " + state.accessToken;

    const res = await fetch(apiUrl(path), Object.assign({}, options, { headers }));
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }

    if (!res.ok) {
      const message = (data && (data.message || data.error)) || res.statusText;
      throw new Error(`${res.status} ${message}`);
    }
    return data;
  }

  // -- 0. API base --
  $("apiBase").value = state.apiBase;
  $("saveBase").addEventListener("click", () => {
    state.apiBase = $("apiBase").value.trim();
    localStorage.setItem("cf_api_base", state.apiBase);
    showStatus($("baseStatus"), "저장됨: " + state.apiBase, "ok");
  });

  // -- 1. Signup --
  $("signupBtn").addEventListener("click", async () => {
    try {
      const data = await api("/signup", {
        method: "POST",
        body: JSON.stringify({
          name: $("signupName").value,
          username: $("signupUsername").value,
          email: $("signupEmail").value,
          password: $("signupPassword").value,
        }),
      });
      showStatus($("signupStatus"), "가입 성공: " + JSON.stringify(data), "ok");
    } catch (err) {
      showStatus($("signupStatus"), "가입 실패: " + err.message, "err");
    }
  });

  // -- 2. Login / Logout --
  $("loginBtn").addEventListener("click", async () => {
    try {
      const data = await api("/login", {
        method: "POST",
        body: JSON.stringify({
          username: $("loginUsername").value,
          password: $("loginPassword").value,
        }),
      });
      state.accessToken = data.accessToken;
      state.username = $("loginUsername").value;
      localStorage.setItem("cf_access_token", state.accessToken);
      localStorage.setItem("cf_username", state.username);
      refreshWhoAmI();
      showStatus($("loginStatus"), "로그인 성공, 토큰 발급됨", "ok");
    } catch (err) {
      showStatus($("loginStatus"), "로그인 실패: " + err.message, "err");
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    try {
      await api("/logout", { method: "POST" });
    } catch (_) {
      // 서버가 이미 만료/무효 처리했어도 클라이언트 상태는 정리한다.
    }
    state.accessToken = "";
    state.username = "";
    localStorage.removeItem("cf_access_token");
    localStorage.removeItem("cf_username");
    refreshWhoAmI();
    showStatus($("loginStatus"), "로그아웃 완료", "info");
  });

  // -- 3. Rooms --
  async function refreshRooms() {
    try {
      const rooms = await api("/rooms");
      const list = $("roomList");
      list.innerHTML = "";
      rooms.forEach((room) => {
        const li = document.createElement("li");

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = `#${room.id} ${room.name}`;
        li.appendChild(name);

        const joinBtn = document.createElement("button");
        joinBtn.textContent = "참가";
        joinBtn.addEventListener("click", () => joinRoom(room.id));
        li.appendChild(joinBtn);

        const enterBtn = document.createElement("button");
        enterBtn.textContent = "입장(ws)";
        enterBtn.addEventListener("click", () => connectWebSocket(room.id));
        li.appendChild(enterBtn);

        list.appendChild(li);
      });
      showStatus($("roomStatus"), `방 ${rooms.length}개 로드됨`, "ok");
    } catch (err) {
      showStatus($("roomStatus"), "방 목록 조회 실패: " + err.message, "err");
    }
  }

  $("refreshRoomsBtn").addEventListener("click", refreshRooms);

  $("createRoomBtn").addEventListener("click", async () => {
    try {
      const room = await api("/rooms", {
        method: "POST",
        body: JSON.stringify({
          name: $("roomName").value,
          description: $("roomDesc").value,
        }),
      });
      showStatus($("roomStatus"), `방 생성됨: ${JSON.stringify(room)}`, "ok");
      await refreshRooms();
    } catch (err) {
      showStatus($("roomStatus"), "방 생성 실패: " + err.message, "err");
    }
  });

  async function joinRoom(roomId) {
    try {
      await api(`/rooms/${roomId}/join`, { method: "POST" });
      showStatus($("roomStatus"), `방 ${roomId} 참가 완료`, "ok");
    } catch (err) {
      showStatus($("roomStatus"), "방 참가 실패: " + err.message, "err");
    }
  }

  // -- 4. WebSocket chat --
  function appendLog(text, cls) {
    const line = document.createElement("div");
    line.className = "msg" + (cls ? " " + cls : "");
    line.textContent = text;
    const log = $("log");
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function connectWebSocket(roomId) {
    if (!state.accessToken) {
      showStatus($("roomStatus"), "먼저 로그인하세요", "err");
      return;
    }
    if (state.ws) {
      state.ws.close();
      state.ws = null;
    }

    const wsBase = state.apiBase.replace(/^http/, "ws").replace(/\/+$/, "");
    const url = `${wsBase}/ws?room_id=${roomId}&token=${encodeURIComponent(state.accessToken)}`;

    $("log").innerHTML = "";
    appendLog(`연결 시도: room ${roomId}`, "sys");

    const ws = new WebSocket(url);
    state.ws = ws;
    state.currentRoomId = roomId;

    ws.addEventListener("open", () => {
      appendLog("연결됨", "sys");
      $("currentRoom").style.display = "block";
      $("currentRoom").textContent = `현재 방: #${roomId}`;
      $("chatInput").disabled = false;
      $("sendBtn").disabled = false;
      $("disconnectBtn").disabled = false;
    });

    ws.addEventListener("message", (event) => {
      let payload;
      try { payload = JSON.parse(event.data); } catch (_) { payload = { content: event.data }; }
      if (payload.type === "join" || payload.type === "leave") {
        appendLog(`* ${payload.sender} ${payload.type === "join" ? "입장" : "퇴장"}`, "sys");
      } else {
        appendLog(`${payload.sender || "?"}: ${payload.content || ""}`);
      }
    });

    ws.addEventListener("close", () => {
      appendLog("연결 종료됨", "sys");
      $("chatInput").disabled = true;
      $("sendBtn").disabled = true;
      $("disconnectBtn").disabled = true;
      state.ws = null;
    });

    ws.addEventListener("error", () => {
      appendLog("연결 오류 발생 (콘솔 확인)", "sys");
    });
  }

  function sendChat() {
    const input = $("chatInput");
    const text = input.value.trim();
    if (!text || !state.ws || state.ws.readyState !== WebSocket.OPEN) return;
    state.ws.send(JSON.stringify({ type: "message", content: text }));
    input.value = "";
  }

  $("sendBtn").addEventListener("click", sendChat);
  $("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat();
  });

  $("disconnectBtn").addEventListener("click", () => {
    if (state.ws) state.ws.close();
  });

  refreshWhoAmI();
})();
</script>
</body>
</html>
