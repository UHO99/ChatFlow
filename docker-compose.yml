services:
  postgres:
    image: postgres:latest
    container_name: test_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d test"]
      interval: 5s
      timeout: 5s
      retries: 10

  go:
    build:
      context: ./GoChat
    container_name: gochat_app
    environment:
      DB_SOURCE: postgresql://root:1234@postgres:5432/test?sslmode=disable
      SERVER_ADDRESS: 0.0.0.0:8080
      TOKEN_SYMMETRIC_KEY: DIARY_AND_COMMUNITY_PROJECT_DAWNARY_ADMIN_SECRET_KEY
      ACCESS_TOKEN_DURATION: 15m
    depends_on:
      postgres:
        condition: service_healthy

  spring:
    build:
      context: ./SpringAuth
    container_name: springauth_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
      secret: RElBUllfQU5EX0NPTU1VTklUWV9QUk9KRUNUX0RBV05BUllfQURNSU5fU0VDUkVUX0tFWQ==
      expiration_time: 86400000
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: chatflow_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - go
      - spring
